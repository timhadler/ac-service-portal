# The build does not generate anything: the .html files are committed.
# This command only refuses to publish a tree whose output is stale.
#
# If it ever fails for a reason you cannot fix, delete the [build] section
# (not the whole file: the headers below must stay) — the site deploys
# fine without it, because the HTML is already in the repo.
[build]
  publish = "."
  command = "python3 tools/build.py --check"

# The booking confirmation page is reached only from the booking software's
# post-booking redirect, so it must never appear in search results. A header,
# not a robots.txt Disallow: a blocked page can still be listed by URL, and
# Google would never see the noindex. The splat also covers the .html path.
[[headers]]
  for = "/booking-confirmed*"
  [headers.values]
    X-Robots-Tag = "noindex"
