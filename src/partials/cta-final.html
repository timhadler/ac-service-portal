        <!-- ══════════════════════════════════════════════════════
            BOTTOM CTA — the shared closing section on the consumer
            pages. The eyebrow is the slogan by default (site.vars);
            a page may override cta_eyebrow and cta_body in its own
            front matter, as about.html does.
        ═══════════════════════════════════════════════════════ -->
        <section class="section section--sky" aria-labelledby="cta-heading" data-track-location="final-cta">
            <div class="cta-block">
                <span class="label label--center">{{ cta_eyebrow }}</span>
                <h2 id="cta-heading">Book your heat pump clean today</h2>
                <p>{{ cta_body }}</p>
                <div class="cta-block__actions">
                    <a href="{{ booking_url }}"
                        class="btn btn--primary"
                        target="_blank"
                        rel="noopener">
                        Book Online
                    </a>
                    <a href="contact.html" class="btn btn--blue">Get in touch</a>
                </div>
            </div>
        </section>
