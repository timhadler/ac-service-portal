    <!-- ════════════════════════════════════════════════════
         TRUST BAR — small, immediately below the hero.

         The four labels come from a trust.* group in src/site.vars:
         trust.consumer on the home page, trust.b2b on the commercial
         hub and property managers. Same markup, different claims,
         because the two audiences are buying on different things.
    ════════════════════════════════════════════════════ -->
    <div class="trust-bar" aria-label="Key trust signals">
      <div class="trust-bar__inner">

        <div class="trust-item">
          <div class="trust-item__icon" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <path d="M2 5l2.5 2.5L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          {{ trust_item_1 }}
        </div>

        <div class="trust-item">
          <div class="trust-item__icon" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <path d="M2 5l2.5 2.5L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          {{ trust_item_2 }}
        </div>

        <div class="trust-item">
          <div class="trust-item__icon" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <path d="M2 5l2.5 2.5L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          {{ trust_item_3 }}
        </div>

        <div class="trust-item">
          <div class="trust-item__icon" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <path d="M2 5l2.5 2.5L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          {{ trust_item_4 }}
        </div>

      </div>
    </div>
